<!-- Interactive Game Modal Container -->
<div id="game-modal" class="fixed inset-0 z-50 bg-purple-950/70 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-white border-2 border-purple-200 rounded-3xl max-w-xl w-full p-6 shadow-2xl relative flex flex-col items-center">
        <!-- Close Button -->
        <button onclick="closeGameModal()" class="absolute top-4 right-4 p-2 bg-purple-100 hover:bg-purple-200 text-purple-900 rounded-full transition">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <h3 class="font-display text-2xl font-bold text-purple-950 mb-1">Vertical Jumper</h3>
        <p class="text-xs text-purple-600 mb-4">Press <kbd class="px-2 py-0.5 bg-purple-100 border border-purple-300 rounded text-purple-900 font-mono">Spacebar</kbd> or Tap to Jump!</p>

        <!-- Canvas Game Frame -->
        <canvas id="jumperCanvas" width="360" height="480" class="bg-gradient-to-b from-sky-100 to-purple-100 border-2 border-purple-200 rounded-2xl shadow-inner cursor-pointer"></canvas>

        <div class="mt-4 flex gap-3">
            <button onclick="resetGame()" class="px-4 py-2 bg-softPurple text-white font-display font-bold rounded-xl shadow hover:bg-purple-600 transition text-sm">Restart Game</button>
        </div>
    </div>
</div>

<script>
    // Game State Variables
    let canvas, ctx;
    let player, platforms, score, gameLoopId;
    let isPlaying = false;

    // Trigger Modal & Launch Canvas Game
    function launchGame() {
        document.getElementById('game-modal').classList.remove('hidden');
        canvas = document.getElementById('jumperCanvas');
        ctx = canvas.getContext('2d');
        resetGame();
    }

    function closeGameModal() {
        document.getElementById('game-modal').classList.add('hidden');
        cancelAnimationFrame(gameLoopId);
        isPlaying = false;
    }

    function resetGame() {
        cancelAnimationFrame(gameLoopId);
        score = 0;
        player = { x: 165, y: 380, width: 30, height: 30, vy: -8, gravity: 0.4 };
        platforms = [
            { x: 130, y: 420, width: 100, height: 12 },
            { x: 50, y: 310, width: 90, height: 12 },
            { x: 200, y: 200, width: 90, height: 12 },
            { x: 90, y: 90, width: 90, height: 12 }
        ];
        isPlaying = true;
        gameLoop();
    }

    // Main Game Loop
    function gameLoop() {
        if (!isPlaying) return;

        // Physics Updates
        player.vy += player.gravity;
        player.y += player.vy;

        // Platform Collisions
        platforms.forEach(p => {
            if (player.vy > 0 && 
                player.x + player.width > p.x && 
                player.x < p.x + p.width && 
                player.y + player.height >= p.y && 
                player.y + player.height <= p.y + p.height + 6) {
                player.vy = -9.5; // Jump bounce
            }
        });

        // Camera Scroll Upwards
        if (player.y < 200) {
            let diff = 200 - player.y;
            player.y = 200;
            score += Math.floor(diff);
            platforms.forEach(p => {
                p.y += diff;
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * (canvas.width - p.width);
                }
            });
        }

        // Draw Game Elements
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Platforms
        ctx.fillStyle = '#c084fc';
        platforms.forEach(p => {
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.width, p.height, 6);
            ctx.fill();
        });

        // Draw Character
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.width, player.height, 8);
        ctx.fill();

        // Draw Score
        ctx.fillStyle = '#3b0764';
        ctx.font = 'bold 16px Quicksand';
        ctx.fillText(`Score: ${score}`, 16, 30);

        // Game Over Condition
        if (player.y > canvas.height) {
            ctx.fillStyle = '#581c87';
            ctx.font = 'bold 22px Fredoka';
            ctx.fillText('Game Over!', 120, 240);
            isPlaying = false;
            return;
        }

        gameLoopId = requestAnimationFrame(gameLoop);
    }

    // Spacebar Jump / Touch Controls
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && isPlaying) {
            e.preventDefault();
            player.vy = -9.5;
        }
    });

    document.getElementById('jumperCanvas')?.addEventListener('click', () => {
        if (isPlaying) player.vy = -9.5;
    });
</script>
